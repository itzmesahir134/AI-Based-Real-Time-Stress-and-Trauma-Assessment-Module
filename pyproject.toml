[project]
name = "saathi-ai"
version = "0.1.0"
description = "AI-Based Real-Time Stress and Trauma Assessment Module"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "SAATHI-AI Team" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "livekit-api>=0.6.0",
    "livekit-agents>=0.8.0",
    "numpy>=1.26.4",
    "scipy>=1.13.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "datamodel-code-generator>=0.25.8",
    "psycopg2-binary>=2.9.9",
    "aiosqlite>=0.20.0",
]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.1",
]
ml = [
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "faster-whisper>=1.0.2",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "scikit-learn>=1.4.2",
    "mlflow>=2.12.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["services", "packages"]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security checks)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # Line length handled by formatter
    "B008",  # Do not perform function call in argument defaults (FastAPI Depends)
    "S104",  # Possible binding to all interfaces (common in docker apps)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "PLR2004"]  # Allow assert and magic values in tests
"scripts/**" = ["S101", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers -v"
markers = [
    "unit: Fast unit tests (spec §43 SVI tests, scoring formulas, schemas)",
    "integration: Multi-service and database integration tests",
    "model: ML inference, acoustic extraction and calibration tests",
    "safety: Critical safety override and crisis detection tests",
    "e2e: End-to-end simulated emergency call flows (spec §52)",
    "slow: Tests requiring heavy audio/model processing",
]

[tool.coverage.run]
branch = true
source = ["services", "packages"]
omit = [
    "tests/*",
    "**/__pycache__/*",
    "**/migrations/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
