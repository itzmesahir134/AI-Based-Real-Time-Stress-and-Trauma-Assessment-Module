services:
  postgres:
    image: postgres:16-alpine
    container_name: saathi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saathi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saathi_password}
      POSTGRES_DB: ${POSTGRES_DB:-saathi_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saathi} -d ${POSTGRES_DB:-saathi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: saathi-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: saathi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Database Migrations (runs before api and worker start) ---
  migrate:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    container_name: saathi-migrate
    command: alembic -c infra/migrations/alembic.ini upgrade head
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-saathi}:${POSTGRES_PASSWORD:-saathi_password}@postgres:5432/${POSTGRES_DB:-saathi_db}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --- FastAPI REST API Service ---
  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    container_name: saathi-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-saathi}:${POSTGRES_PASSWORD:-saathi_password}@postgres:5432/${POSTGRES_DB:-saathi_db}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Audio & ML Processing Worker ---
  worker:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.worker
    container_name: saathi-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-saathi}:${POSTGRES_PASSWORD:-saathi_password}@postgres:5432/${POSTGRES_DB:-saathi_db}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
