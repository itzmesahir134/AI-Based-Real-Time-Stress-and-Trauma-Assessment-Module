# SAATHI-AI — Module Pipeline I/O Map
# =====================================================================
# This file is the AUTHORITATIVE definition of:
#   - Which folder each module reads its input from
#   - Which folder each module writes its output to
#   - The output format produced by each module
#
# All test harnesses, batch runners, and pipeline tests MUST import
# paths from this file (or from pipeline_config.py which reads it)
# rather than hard-coding folder paths.
#
# Convention:
#   input  → folder containing files fed INTO the module
#   output → folder where the module writes its results
#   format → schema/type of the output (see packages/schemas/)
# =====================================================================

pipeline_root: "test_audio/pipeline_io"
incoming_raw: "test_audio/incoming"

modules:

  # ----------------------------------------------------------------
  # M04 — Audio Quality Analyzer
  # Input:  raw WAV files (grouped with M06 under shared_raw/)
  # Output: AudioQualityResult JSON per file
  # ----------------------------------------------------------------
  m04_quality_check:
    module: "services.audio_worker.quality.analyze_audio_quality"
    input:
      folder: "test_audio/pipeline_io/shared_raw"
      accepts: ["*.wav"]
      description: >
        Grouped raw audio pool (shared with M06).
        May be 8kHz or 16kHz, mono or stereo, any recording quality.
        Uses NTFS hardlinks to zero-out duplicate disk usage.
    output:
      folder: "test_audio/pipeline_io/m04_quality_check/output"
      format: "AudioQualityResult (JSON)"
      filename_pattern: "{stem}_quality.json"
      schema: "packages.schemas.audio.AudioQualityResult"
    flags_emitted:
      - NEAR_SILENCE
      - CLIPPING_DETECTED
      - HIGH_NOISE_FLOOR
      - LOW_SPEECH_ACTIVITY
      - NETWORK_PACKET_LOSS
      - EMPTY_AUDIO

  # ----------------------------------------------------------------
  # M06 — Audio Preprocessor
  # Input:  raw WAV files (grouped with M04 under shared_raw/)
  # Output: normalized 16kHz mono WAV files (written to shared_16k/)
  # ----------------------------------------------------------------
  m06_preprocessor:
    module: "services.audio_worker.preprocessor.preprocess_audio"
    input:
      folder: "test_audio/pipeline_io/shared_raw"
      accepts: ["*.wav"]
      description: >
        Grouped raw audio pool (shared with M04).
        Resampling to 16kHz and mono-downmix is applied here.
    output:
      folder: "test_audio/pipeline_io/shared_16k"
      format: "WAV, 16kHz, 16-bit, mono, float32 normalized"
      filename_pattern: "{stem}_16k_mono.wav"
    notes: >
      Output of M06 is written directly to shared_16k/, making it
      immediately accessible to M05 and M07 without duplicate copies.

  # ----------------------------------------------------------------
  # M05 — Voice Activity Detector
  # Input:  preprocessed 16kHz mono WAV (grouped with M07 under shared_16k/)
  # Output: List[SpeechSegment] JSON per file
  # ----------------------------------------------------------------
  m05_vad:
    module: "services.audio_worker.vad.detect_voice_activity"
    input:
      folder: "test_audio/pipeline_io/shared_16k"
      accepts: ["*.wav"]
      description: >
        Grouped 16kHz mono audio pool (shared with M07).
        Contains M06 preprocessed audio and curated 16kHz samples.
    output:
      folder: "test_audio/pipeline_io/m05_vad/output"
      format: "List[SpeechSegment] (JSON)"
      filename_pattern: "{stem}_vad.json"
      schema: "packages.schemas.audio.SpeechSegment"
    depends_on: ["m06_preprocessor"]

  # ----------------------------------------------------------------
  # M07 — Speech-to-Text (ASR)
  # Input:  preprocessed 16kHz mono WAV (grouped with M05 under shared_16k/)
  # Output: TranscriptResponse JSON per file
  # ----------------------------------------------------------------
  m07_asr:
    module: "services.audio_worker.asr.Transcriber.transcribe"
    input:
      folder: "test_audio/pipeline_io/shared_16k"
      accepts: ["*.wav"]
      description: >
        Grouped 16kHz mono audio pool (shared with M05).
        Language hint passed per-file via filename heuristics/metadata.
    output:
      folder: "test_audio/pipeline_io/m07_asr/output"
      format: "TranscriptResponse (JSON)"
      filename_pattern: "{stem}_transcript.json"
      schema: "packages.schemas.audio.TranscriptResponse"
    depends_on: ["m06_preprocessor"]
    language_metadata: "{stem}_meta.json"


